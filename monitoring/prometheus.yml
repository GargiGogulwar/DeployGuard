global:
  scrape_interval: 5s      # short interval so the demo reacts quickly
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: deployguard
    metrics_path: /metrics
    static_configs:
      - targets: ["deployguard:8000"]   # service name on the compose network

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
